name: Apply continuation-row cache

on:
  push:
    branches: [agent/cache-continuation-rows]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[continuation-rows-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          cat > /tmp/continuation-rows.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/continuation-rows.patch.gz.b64 | gzip -d > /tmp/continuation-rows.patch
          git apply --check /tmp/continuation-rows.patch
          git apply /tmp/continuation-rows.patch
      - name: Commit source changes
        run: |
          git config user.name "Proton engine automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add src/engine/search.h src/engine/search.cpp tests/test_engine.cpp
          git commit -m "Cache live continuation-history rows [continuation-rows-applied]"
          git push
