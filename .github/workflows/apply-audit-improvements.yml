name: Apply audit improvements

on:
  push:
    branches: [agent/current-main-audit]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewed source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          see = Path("src/engine/see.cpp")
          text = see.read_text()
          text = text.replace(
              "#include <cstdlib>\n",
              "#include <cstdlib>\n#include <cstddef>\n",
          )
          text = text.replace(
              "namespace {\n\n[[nodiscard]] Bitboard colour_pieces(const std::array<Bitboard, 13>& pieces,\n                                     Color color) {\n",
              """namespace {

          constexpr std::size_t PieceSlotCount = 13;
          using PieceBitboards = std::array<Bitboard, PieceSlotCount>;

          [[nodiscard]] constexpr bool is_board_piece(Piece piece) {
              return piece >= WhitePawn && piece <= BlackKing;
          }

          [[nodiscard]] constexpr std::size_t piece_index(Piece piece) {
              const std::size_t index = static_cast<std::size_t>(piece);
              return index < PieceSlotCount ? index : 0;
          }

          [[nodiscard]] Bitboard colour_pieces(const PieceBitboards& pieces,
                                               Color color) {
          """,
          )
          text = text.replace(
              "        result |= pieces[make_piece(color, static_cast<PieceType>(type))];\n",
              "        result |= pieces[piece_index(\n            make_piece(color, static_cast<PieceType>(type)))];\n",
          )
          text = text.replace(
              "                                      std::array<Bitboard, 13>& pieces,\n",
              "                                      PieceBitboards& pieces,\n",
          )
          text = text.replace(
              "    const int king = piece_type(attacker) == King ? target : king_squares[color];\n",
              "    if (!is_board_piece(attacker) || source < 0 || source >= 64) return false;\n    const int king = piece_type(attacker) == King ? target : king_squares[color];\n",
          )
          text = text.replace("    pieces[attacker] &= ~source_bit;\n",
                              "    pieces[piece_index(attacker)] &= ~source_bit;\n")
          text = text.replace("    pieces[attacker] |= source_bit;\n",
                              "    pieces[piece_index(attacker)] |= source_bit;\n")
          text = text.replace(
              "    Bitboard attackers, Bitboard occupied, std::array<Bitboard, 13>& pieces,\n",
              "    Bitboard attackers, Bitboard occupied, PieceBitboards& pieces,\n",
          )
          for old, new in {
              "pieces[king_piece]": "pieces[piece_index(king_piece)]",
              "pieces[pawn]": "pieces[piece_index(pawn)]",
              "pieces[piece]": "pieces[piece_index(piece)]",
              "std::array<Bitboard, 13> pieces{};": "PieceBitboards pieces{};",
              "pieces[moving] &= ~bit(move.from);": "pieces[piece_index(moving)] &= ~bit(move.from);",
              "pieces[captured] &= ~bit(captured_square);": "pieces[piece_index(captured)] &= ~bit(captured_square);",
              "pieces[attacker.piece] &= ~bit(attacker.square);": "pieces[piece_index(attacker.piece)] &= ~bit(attacker.square);",
          }.items():
              text = text.replace(old, new)
          text = text.replace(
              "    const Piece moving = position.piece_at(move.from);\n    if (moving == Empty || piece_color(moving) != us) return -piece_value(King);\n",
              """    const Piece moving = position.piece_at(move.from);
              if (!is_board_piece(moving) || piece_color(moving) != us) {
                  return -piece_value(King);
              }
              if (move.is_promotion() &&
                  (move.promotion < Knight || move.promotion > Queen)) {
                  return -piece_value(King);
              }
          """,
          )
          text = text.replace(
              "        if (attacker.piece == Empty) break;\n\n        const PieceType attacker_type = piece_type(attacker.piece);\n",
              """        if (!is_board_piece(attacker.piece) || attacker.square < 0 ||
                      attacker.square >= 64) {
                      break;
                  }

                  const PieceType attacker_type = piece_type(attacker.piece);
          """,
          )
          if "PieceSlotCount" not in text or "piece_index(attacker.piece)" not in text:
              raise SystemExit("SEE patch did not apply")
          see.write_text(text)

          evaluation = Path("src/engine/eval.cpp")
          text = evaluation.read_text()
          text = text.replace(
              "using AttackByType = std::array<std::array<Bitboard, 6>, 2>;\n",
              """// Only pawn, knight, bishop and rook attacks can be materially cheaper
          // than a non-king victim. Queen and king attacks can never activate the
          // bounded pressure term, so do not maintain redundant per-type maps for them.
          constexpr std::size_t ThreatAttackerTypeCount =
              static_cast<std::size_t>(Rook) + 1;
          using AttackByType =
              std::array<std::array<Bitboard, ThreatAttackerTypeCount>, 2>;

          static_assert(ThreatAttackerTypeCount == 4);
          """,
          )
          text = text.replace(
              "    const std::array<Bitboard, 6>& attacks_by_type, int square) {\n",
              "    const std::array<Bitboard, ThreatAttackerTypeCount>& attacks_by_type,\n    int square) {\n",
          )
          text = text.replace(
              "    for (PieceType type : {Pawn, Knight, Bishop, Rook, Queen, King}) {\n        if ((attacks_by_type[type] & target) != 0) return piece_value(type);\n",
              """    for (PieceType type : {Pawn, Knight, Bishop, Rook}) {
                  if ((attacks_by_type[static_cast<std::size_t>(type)] & target) != 0) {
                      return piece_value(type);
                  }
          """,
          )
          text = text.replace(
              "        Bitboard threatened = position.occupancy(color) & attack_maps[enemy];\n        threatened &= ~position.pieces(make_piece(color, King));\n",
              """        Bitboard threatened = position.occupancy(color) & attack_maps[enemy] &
                                        attack_maps[color];
                  threatened &= ~position.pieces(make_piece(color, King));
          """,
          )
          text = text.replace(
              "            if (victim == NoPieceType || victim == King) continue;\n\n            const bool defended = (attack_maps[color] & bit(square)) != 0;\n",
              "            if (victim == NoPieceType || victim == Pawn || victim == King) continue;\n\n            constexpr bool defended = true;\n",
          )
          text = text.replace(
              "    attacks_by_type[White][Pawn] = pawn_attacks[White];\n    attacks_by_type[Black][Pawn] = pawn_attacks[Black];\n",
              """    attacks_by_type[White][static_cast<std::size_t>(Pawn)] =
                  pawn_attacks[White];
              attacks_by_type[Black][static_cast<std::size_t>(Pawn)] =
                  pawn_attacks[Black];
          """,
          )
          text = text.replace(
              "                attacks_by_type[color][type] |= piece_map;\n",
              """                if (type <= Rook) {
                      attacks_by_type[color][static_cast<std::size_t>(type)] |=
                          piece_map;
                  }
          """,
          )
          if "ThreatAttackerTypeCount" not in text or "if (type <= Rook)" not in text:
              raise SystemExit("evaluation patch did not apply")
          evaluation.write_text(text)

          tests = Path("tests/test_engine.cpp")
          text = tests.read_text()
          needle = """    expect(evaluate(\"1N5k/P1K5/1r6/8/8/8/8/8 b - - 0 1\", \"b6b8\") == -1030,
                     \"SEE prefers a safe promotion over a safe king recapture\");
          """
          addition = needle + """
              proton::Position malformed_promotion_position;
              expect(malformed_promotion_position.set_fen(
                         \"6k1/P7/8/8/8/8/8/6K1 w - - 0 1\"),
                     \"malformed SEE promotion FEN parses\");
              const proton::Move malformed_promotion{
                  48, 56, static_cast<proton::PieceType>(13), proton::MovePromotion};
              expect(proton::static_exchange_eval(malformed_promotion_position,
                                                  malformed_promotion) ==
                         -proton::piece_value(proton::King),
                     \"SEE rejects an out-of-range promotion type before indexing piece maps\");
          """
          if needle not in text:
              raise SystemExit("SEE test insertion point missing")
          tests.write_text(text.replace(needle, addition))
          PY
      - name: Commit source changes
        run: |
          git config user.name "Proton audit automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add src/engine/eval.cpp src/engine/see.cpp tests/test_engine.cpp
          git commit -m "Optimise threat maps and harden SEE indexing [audit-applied]"
          git push
