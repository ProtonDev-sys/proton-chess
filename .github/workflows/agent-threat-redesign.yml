name: Apply threat redesign

on:
  push:
    branches: [agent/threat-aware-eval]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply invariant-preserving threat redesign
        run: |
          python - <<'PY'
          from pathlib import Path

          eval_path = Path("src/engine/eval.cpp")
          text = eval_path.read_text()
          old = '''[[nodiscard]] ThreatPenalty threat_penalty(PieceType victim,
                                                     int least_attacker,
                                                     bool defended,
                                                     bool attacker_to_move) {
              const int victim_value = piece_value(victim);
              ThreatPenalty penalty;

              // A loose piece is tactically fragile even when the current search horizon
              // does not yet contain the capture. Keep the term deliberately below the
              // material value so search, not evaluation, remains authoritative.
              if (!defended) {
                  penalty.mg += std::clamp(victim_value / 12, 8, 64);
                  penalty.eg += std::clamp(victim_value / 14, 6, 56);
              }

              // A defended piece still loses freedom when a cheaper unit attacks it: the
              // opponent can often gain a tempo or force an unfavourable exchange.
              if (least_attacker + 50 < victim_value) {
                  const int exchange_gap = victim_value - least_attacker;
                  penalty.mg += std::clamp(exchange_gap / 18, 6, 42);
                  penalty.eg += std::clamp(exchange_gap / 20, 5, 38);
              }

              // The threatened side can often answer immediately. Retain most of the
              // signal for move ordering while distinguishing an executable threat from
              // one that still has to survive the opponent's turn.
              if (!attacker_to_move) {
                  penalty.mg = penalty.mg * 2 / 3;
                  penalty.eg = penalty.eg * 2 / 3;
              }
              return penalty;
          }'''
          new = '''[[nodiscard]] ThreatPenalty threat_penalty(PieceType victim,
                                                     int least_attacker,
                                                     bool defended) {
              // Quiescence already resolves executable captures. Pricing loose pieces
              // here double-counts hanging material and makes shallow search unstable.
              // Static evaluation therefore measures only the positional pressure on a
              // defended piece attacked by a materially cheaper unit.
              if (!defended) return {};

              const int victim_value = piece_value(victim);
              if (least_attacker + piece_value(Pawn) >= victim_value) return {};

              const int exchange_gap = victim_value - least_attacker;
              return {
                  std::clamp(exchange_gap / 40, 4, 20),
                  std::clamp(exchange_gap / 52, 3, 16),
              };
          }'''
          if text.count(old) != 1:
              raise SystemExit("threat_penalty block no longer matches")
          text = text.replace(old, new)

          old_call = '''            const ThreatPenalty penalty = threat_penalty(
                          victim, attacker, defended, position.side_to_move() == enemy);'''
          new_call = '''            const ThreatPenalty penalty =
                          threat_penalty(victim, attacker, defended);'''
          if text.count(old_call) != 1:
              raise SystemExit("threat_penalty call no longer matches")
          eval_path.write_text(text.replace(old_call, new_call))

          Path("tests/test_threat_eval.cpp").write_text(r'''#include <cmath>
          #include <iostream>
          #include <string>

          #include "engine/eval.h"

          namespace {

          int failures = 0;

          void expect(bool condition, const std::string& message) {
              if (!condition) {
                  ++failures;
                  std::cerr << "FAIL: " << message << '\n';
              }
          }

          int white_score(proton::Evaluator& evaluator, const std::string& fen,
                          const std::string& label) {
              proton::Position position;
              if (!position.set_fen(fen)) {
                  expect(false, label + " FEN parses");
                  return 0;
              }
              const int score = evaluator.evaluate(position);
              return position.side_to_move() == proton::White ? score : -score;
          }

          int side_score(proton::Evaluator& evaluator, const std::string& fen,
                         const std::string& label) {
              proton::Position position;
              if (!position.set_fen(fen)) {
                  expect(false, label + " FEN parses");
                  return 0;
              }
              return evaluator.evaluate(position);
          }

          void test_defended_piece_pressure() {
              proton::Evaluator evaluator;

              const int loose_attacked = white_score(
                  evaluator, "8/8/7k/2p5/3Q4/8/8/K7 w - - 0 1",
                  "loose attacked queen");
              const int loose_safe = white_score(
                  evaluator, "8/8/7k/5p2/3Q4/8/8/K7 w - - 0 1",
                  "loose safe queen");
              const int defended_attacked = white_score(
                  evaluator, "8/8/7k/2p5/3Q4/5N2/8/K7 w - - 0 1",
                  "defended attacked queen");
              const int defended_safe = white_score(
                  evaluator, "8/8/7k/5p2/3Q4/5N2/8/K7 w - - 0 1",
                  "defended safe queen");

              const int loose_gap = loose_safe - loose_attacked;
              const int defended_gap = defended_safe - defended_attacked;
              expect(defended_gap >= loose_gap + 8,
                     "a defended queen attacked by a pawn carries a bounded pressure "
                     "penalty beyond the matching loose-piece control (defended=" +
                         std::to_string(defended_gap) + ", loose=" +
                         std::to_string(loose_gap) + ")");
          }

          void test_pressure_is_side_to_move_independent() {
              proton::Evaluator evaluator;

              const int attacked_white = white_score(
                  evaluator, "8/8/7k/2p5/3Q4/5N2/8/K7 w - - 0 1",
                  "attacked queen with White to move");
              const int safe_white = white_score(
                  evaluator, "8/8/7k/5p2/3Q4/5N2/8/K7 w - - 0 1",
                  "safe queen with White to move");
              const int attacked_black = white_score(
                  evaluator, "8/8/7k/2p5/3Q4/5N2/8/K7 b - - 0 1",
                  "attacked queen with Black to move");
              const int safe_black = white_score(
                  evaluator, "8/8/7k/5p2/3Q4/5N2/8/K7 b - - 0 1",
                  "safe queen with Black to move");

              const int white_gap = safe_white - attacked_white;
              const int black_gap = safe_black - attacked_black;
              expect(std::abs(white_gap - black_gap) <= 1,
                     "static pressure is independent of whose turn it is (white=" +
                         std::to_string(white_gap) + ", black=" +
                         std::to_string(black_gap) + ")");
          }

          void test_pressure_is_colour_symmetric() {
              proton::Evaluator evaluator;
              const int white = side_score(
                  evaluator, "8/8/7k/2p5/3Q4/5N2/8/K7 w - - 0 1",
                  "white defended threatened queen");
              const int black = side_score(
                  evaluator, "7k/8/2n5/4q3/5P2/K7/8/8 b - - 0 1",
                  "mirrored black defended threatened queen");

              expect(std::abs(white - black) <= 1,
                     "pressure evaluation is invariant under colour swap and "
                     "180-degree rotation (white=" + std::to_string(white) +
                         ", black=" + std::to_string(black) + ")");
          }

          }  // namespace

          int main() {
              test_defended_piece_pressure();
              test_pressure_is_side_to_move_independent();
              test_pressure_is_colour_symmetric();

              if (failures != 0) {
                  std::cerr << failures << " threat-evaluation test(s) failed\n";
                  return 1;
              }
              std::cout << "Threat-evaluation tests passed\n";
              return 0;
          }
          ''')
          PY

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/eval.cpp tests/test_threat_eval.cpp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Redesign threat evaluation as bounded static pressure"
          git push
