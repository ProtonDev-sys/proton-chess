name: Apply portable opening-book sampling

on:
  push:
    branches: [agent/portable-book-sampling]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[book-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewed source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          search = Path("src/engine/search.cpp")
          text = search.read_text()
          old = '''void Search::add_book_line(const std::vector<std::string>& moves, int weight) {
              Position position;
              for (const std::string& text : moves) {
                  const Move move = position.parse_uci_move(text);
                  if (move.is_null()) return;
                  auto& entries = book_[position.key()];
                  auto found = std::find_if(entries.begin(), entries.end(), [&](const BookMove& entry) {
                      return entry.move == move;
                  });
                  if (found == entries.end()) entries.push_back(BookMove{move, weight});
                  else found->weight += weight;

                  UndoState undo;
                  if (!position.make_move(move, undo)) return;
              }
          }
          '''
          new = '''void Search::add_book_line(const std::vector<std::string>& moves, int weight) {
              if (weight <= 0) return;

              Position position;
              for (const std::string& text : moves) {
                  const Move move = position.parse_uci_move(text);
                  if (move.is_null()) return;
                  auto& entries = book_[position.key()];
                  auto found = std::find_if(entries.begin(), entries.end(), [&](const BookMove& entry) {
                      return entry.move == move;
                  });
                  if (found == entries.end()) {
                      entries.push_back(BookMove{move, weight});
                  } else {
                      const std::int64_t combined =
                          static_cast<std::int64_t>(found->weight) + weight;
                      found->weight = static_cast<int>(std::min<std::int64_t>(
                          combined, std::numeric_limits<int>::max()));
                  }

                  UndoState undo;
                  if (!position.make_move(move, undo)) return;
              }
          }
          '''
          if old not in text:
              raise SystemExit("add_book_line block not found")
          text = text.replace(old, new)

          old = '''    const double randomness = std::clamp(options_.book_randomness, 0, 100) / 100.0;
              const double exponent = 1.0 + (1.0 - randomness) * 3.0;
              std::vector<double> weights;
              weights.reserve(legal_entries.size());
              for (const BookMove& entry : legal_entries) {
                  weights.push_back(std::pow(static_cast<double>(std::max(1, entry.weight)), exponent));
              }
              std::discrete_distribution<std::size_t> distribution(weights.begin(), weights.end());
              return legal_entries[distribution(random_)].move;
          '''
          new = '''    const int randomness = std::clamp(options_.book_randomness, 1, 100);
              const double exponent = static_cast<double>(400 - 3 * randomness) / 100.0;
              const auto sampling_weight = [exponent](const BookMove& entry) {
                  return std::pow(static_cast<double>(std::max(1, entry.weight)), exponent);
              };

              double total_weight = 0.0;
              for (const BookMove& entry : legal_entries) {
                  total_weight += sampling_weight(entry);
              }
              if (!std::isfinite(total_weight) || total_weight <= 0.0) {
                  return std::max_element(legal_entries.begin(), legal_entries.end(),
                      [](const BookMove& lhs, const BookMove& rhs) {
                          return lhs.weight < rhs.weight;
                      })->move;
              }

              // Use the top 53 generator bits to build an exactly specified [0, 1)
              // double. This avoids implementation-defined distribution behavior and the
              // GCC 14 false-positive emitted by std::discrete_distribution's temporary
              // allocation while retaining the same weighted-book semantics.
              constexpr double InverseTwoTo53 = 1.0 / 9007199254740992.0;
              double target = static_cast<double>(random_() >> 11U) *
                              InverseTwoTo53 * total_weight;
              for (const BookMove& entry : legal_entries) {
                  const double weight = sampling_weight(entry);
                  if (target < weight) return entry.move;
                  target -= weight;
              }
              return legal_entries.back().move;
          '''
          if old not in text:
              raise SystemExit("book sampler block not found")
          search.write_text(text.replace(old, new))

          tests = Path("tests/test_engine.cpp")
          text = tests.read_text()
          old = '''    static std::uint64_t nodes(const Search& search) { return search.nodes_; }
          };
          '''
          new = '''    static std::uint64_t nodes(const Search& search) { return search.nodes_; }

              static Move select_book_move(Search& search, const Position& position) {
                  return search.select_book_move(position);
              }

              static void add_book_line(Search& search,
                                        const std::vector<std::string>& moves,
                                        int weight) {
                  search.add_book_line(moves, weight);
              }

              static int book_weight(const Search& search, std::uint64_t key,
                                     const Move& move) {
                  const auto found = search.book_.find(key);
                  if (found == search.book_.end()) return 0;
                  const auto entry = std::find_if(
                      found->second.begin(), found->second.end(),
                      [&](const Search::BookMove& candidate) {
                          return candidate.move == move;
                      });
                  return entry == found->second.end() ? 0 : entry->weight;
              }
          };
          '''
          if old not in text:
              raise SystemExit("SearchTestAccess insertion point not found")
          text = text.replace(old, new)

          marker = '''void test_search_tactics() {
          '''
          function = '''void test_book_selection() {
              proton::EngineOptions deterministic_options;
              deterministic_options.use_book = true;
              deterministic_options.book_file.clear();
              deterministic_options.book_randomness = 0;
              deterministic_options.human_seed = 0x123456789abcdef0ULL;
              proton::Evaluator deterministic_evaluator;
              deterministic_evaluator.set_options(deterministic_options);
              proton::Search deterministic_search(deterministic_evaluator,
                                                  deterministic_options);
              proton::Position start;
              expect(proton::SearchTestAccess::select_book_move(deterministic_search,
                                                                 start).to_uci() == "e2e4",
                     "zero-randomness book selection keeps the highest-weight move");

              proton::EngineOptions weighted_options = deterministic_options;
              weighted_options.book_randomness = 100;
              proton::Evaluator weighted_evaluator;
              weighted_evaluator.set_options(weighted_options);
              proton::Search weighted_search(weighted_evaluator, weighted_options);
              const std::vector<std::string> expected = {
                  "e2e4", "d2d4", "e2e4", "g1f3", "e2e4", "d2d4", "e2e4", "e2e4",
                  "d2d4", "e2e4", "e2e4", "e2e4", "d2d4", "d2d4", "e2e4", "g1f3",
              };
              std::vector<std::string> actual;
              actual.reserve(expected.size());
              for (std::size_t index = 0; index < expected.size(); ++index) {
                  actual.push_back(
                      proton::SearchTestAccess::select_book_move(weighted_search, start)
                          .to_uci());
              }
              expect(actual == expected,
                     "seeded full-randomness book sampling has a portable sequence");

              proton::EngineOptions overflow_options;
              overflow_options.use_book = false;
              proton::Evaluator overflow_evaluator;
              overflow_evaluator.set_options(overflow_options);
              proton::Search overflow_search(overflow_evaluator, overflow_options);
              proton::SearchTestAccess::add_book_line(
                  overflow_search, {"e2e4"}, std::numeric_limits<int>::max());
              proton::SearchTestAccess::add_book_line(overflow_search, {"e2e4"}, 1);
              const proton::Move e4 = start.parse_uci_move("e2e4");
              expect(proton::SearchTestAccess::book_weight(
                         overflow_search, start.key(), e4) ==
                         std::numeric_limits<int>::max(),
                     "duplicate book weights saturate instead of overflowing");
          }

          '''
          if marker not in text:
              raise SystemExit("book test insertion point not found")
          text = text.replace(marker, function + marker)

          old = '''    test_static_exchange();
              test_search_tactics();
          '''
          new = '''    test_static_exchange();
              test_book_selection();
              test_search_tactics();
          '''
          if old not in text:
              raise SystemExit("book test call insertion point not found")
          tests.write_text(text.replace(old, new))
          PY
      - name: Commit reviewed changes
        run: |
          git config user.name "Proton engine automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add src/engine/search.cpp tests/test_engine.cpp
          git commit -m "Make seeded opening-book sampling portable [book-applied]"
          git push
