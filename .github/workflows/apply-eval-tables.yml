name: Apply compile-time evaluator tables

on:
  push:
    branches: [agent/compile-time-eval-tables]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[eval-tables-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          cat > /tmp/eval-tables.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/eval-tables.patch.gz.b64 | gzip -d > /tmp/eval-tables.patch
          git apply --check /tmp/eval-tables.patch
          git apply /tmp/eval-tables.patch
      - name: Commit source changes
        run: |
          git config user.name "Proton engine automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add src/engine/eval.cpp
          git commit -m "Precompute evaluator geometry and mobility weights [eval-tables-applied]"
          git push
