name: Apply compile-time piece evaluation

on:
  push:
    branches: [agent/compile-time-piece-eval]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[piece-eval-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Specialize non-pawn evaluator loops
        run: |
          cat > /tmp/piece-eval.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/piece-eval.patch.gz.b64 | gzip -d > /tmp/piece-eval.patch
          sed -i 's#proton-baseline/src/engine/eval.cpp#src/engine/eval.cpp#g; s#proton-eval-template/src/engine/eval.cpp#src/engine/eval.cpp#g' /tmp/piece-eval.patch
          git apply --check /tmp/piece-eval.patch
          git apply /tmp/piece-eval.patch
      - name: Commit source changes
        run: |
          git config user.name "Proton engine automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add src/engine/eval.cpp
          git commit -m "Specialize non-pawn evaluation by piece type [piece-eval-applied]"
          git push
