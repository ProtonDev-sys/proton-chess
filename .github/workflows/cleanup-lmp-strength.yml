name: Cleanup late-move pruning staging workflows

on:
  push:
    branches: [agent/lmp-strength-1]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove staging workflows
        run: |
          git config user.name "Proton engine automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git rm .github/workflows/apply-lmp-strength.yml
          git rm .github/workflows/cleanup-lmp-strength.yml
          git commit -m "Remove temporary LMP staging workflows [cleanup-done]"
          git push
