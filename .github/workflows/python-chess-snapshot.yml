name: Python chess snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Vendor Python match dependency
        run: python -m pip install -r requirements.txt --target vendor
      - uses: actions/upload-artifact@v6
        with:
          name: proton-python-chess-${{ github.event.pull_request.head.sha }}
          path: vendor
          if-no-files-found: error
          retention-days: 1
