name: Teacher residual benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
      - name: Check out exact pull-request base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - name: Install match dependency
        run: python -m pip install -r candidate/requirements.txt
      - name: Build and test candidate
        run: >-
          cmake -S candidate -B candidate/build -DCMAKE_BUILD_TYPE=Release &&
          cmake --build candidate/build --parallel 2 &&
          ctest --test-dir candidate/build -C Release --output-on-failure
      - name: Build exact baseline
        run: >-
          cmake -S baseline -B baseline/build -DCMAKE_BUILD_TYPE=Release
          -DPROTON_BUILD_TESTS=OFF &&
          cmake --build baseline/build --parallel 2
      - name: Deterministic depth-8 comparison
        working-directory: candidate
        run: >-
          python tools/compare_search.py build/proton_chess
          ../baseline/build/proton_chess
          --candidate-label teacher-residual-25
          --baseline-label main
          --openings openings/uho_lichess_4852_v1_200.epd
          --positions 100 --depth 8 --hash 16 --trials 2 --timeout 60
          --json build/teacher-search.json
      - name: Paired 1000-node match
        working-directory: candidate
        run: >-
          python tools/compare_engines.py build/proton_chess
          ../baseline/build/proton_chess
          --candidate-label teacher-residual-25
          --baseline-label main
          --games 400 --nodes 1000 --watchdog-grace 3
          --max-plies 140 --hash 16 --seed 20261200
          --openings openings/uho_lichess_4852_v1_200.epd
          --json build/teacher-match-1000.json
      - name: Paired 3000-node match
        working-directory: candidate
        run: >-
          python tools/compare_engines.py build/proton_chess
          ../baseline/build/proton_chess
          --candidate-label teacher-residual-25
          --baseline-label main
          --games 400 --nodes 3000 --watchdog-grace 3
          --max-plies 140 --hash 16 --seed 20261201
          --openings openings/uho_lichess_4852_v1_200.epd
          --json build/teacher-match-3000.json
      - name: Print reports
        working-directory: candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              'build/teacher-search.json',
              'build/teacher-match-1000.json',
              'build/teacher-match-3000.json',
              'training/residual_psqt_v1.json',
          ]:
              data = json.loads(Path(path).read_text())
              print(path, json.dumps(data.get('summary', data.get('result', data)), sort_keys=True))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: teacher-residual-benchmark-${{ github.event.pull_request.head.sha }}
          path: |
            candidate/build/teacher-*.json
            candidate/training/residual_psqt_v1.json
          if-no-files-found: error
          retention-days: 14
