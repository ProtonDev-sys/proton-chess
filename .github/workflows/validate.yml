name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ contains(fromJSON('["push","schedule","workflow_dispatch","release"]'), github.event_name) && (vars.CI_SERVER_LINUX == 'true' && !contains(matrix.os, 'arm') && startsWith(matrix.os, 'ubuntu-26.') && fromJSON('["self-hosted","Linux","X64","desktop-3flaofg","ubuntu-26.04"]') || vars.CI_SERVER_LINUX == 'true' && !contains(matrix.os, 'arm') && (startsWith(matrix.os, 'ubuntu-') || contains(matrix.os, 'ubuntu-')) && fromJSON('["self-hosted","Linux","X64","desktop-3flaofg","ubuntu-24.04"]') || vars.CI_SERVER_WINDOWS == 'true' && contains(matrix.os, 'windows-') && !contains(matrix.os, 'arm') && !contains(matrix.os, 'vs2026') && fromJSON('["self-hosted","Windows","X64","desktop-3flaofg"]')) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: build/proton_chess
          - os: windows-latest
            engine: build/Release/proton_chess.exe

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python tooling
        run: python -m pip install -r requirements.txt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run native and UCI tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Compile Python tooling
        run: python -m compileall python tools

      - name: Run perft regressions
        run: python tools/check_perft.py "${{ matrix.engine }}"

      - name: Cross-check legal move generation
        run: python tools/crosscheck_movegen.py "${{ matrix.engine }}" --count 40 --plies 10 --seed 17
