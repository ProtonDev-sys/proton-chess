name: Apply human-variety opportunity patch

on:
  push:
    branches: [agent/human-variety-rate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[human-variety-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          cat > /tmp/human-variety.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/human-variety.patch.gz.b64 | gzip --decompress > /tmp/human-variety.patch
          git apply --check /tmp/human-variety.patch
          git apply /tmp/human-variety.patch
      - name: Commit reviewed changes
        run: |
          git config user.name "Proton engine automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add README.md src/engine/eval.h src/engine/search.cpp src/engine/search.h src/engine/uci.cpp tools/compare_search.py tools/compare_engines.py tests/test_compare_search.py tests/test_compare_engines.py tests/uci_smoke.py tests/test_engine.cpp
          git commit -m "Add seeded human-variety opportunity control [human-variety-applied]"
          git push
