name: Apply PR 20 protocol-integrity fix

on:
  push:
    branches: [agent/fixed-node-ab-matches]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply and commit the staged patch
        run: |
          git apply .github/pr20-fix.patch
          rm .github/pr20-fix.patch
          rm .github/workflows/apply-pr20-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep fixed-node A/B support outside the pinned certification core"
          git push origin HEAD:${GITHUB_REF_NAME}
