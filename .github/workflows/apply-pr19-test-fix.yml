name: Apply PR 19 limiter fixture update

on:
  push:
    branches: [agent/threat-aware-eval]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply and commit the staged patch
        run: |
          git apply .github/pr19-test-fix.patch
          rm .github/pr19-test-fix.patch
          rm .github/workflows/apply-pr19-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep limiter fixtures invariant-based after evaluation changes"
          git push origin HEAD:${GITHUB_REF_NAME}
