name: Apply Stockfish calibration tooling

on:
  push:
    branches: [agent/stockfish18-calibration]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[calibration-tools-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewed tooling patch
        shell: bash
        run: |
          cat > /tmp/calibration-tools.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/calibration-tools.patch.gz.b64 | gzip -d > /tmp/calibration-tools.patch
          git apply --check /tmp/calibration-tools.patch
          git apply /tmp/calibration-tools.patch
      - name: Commit tooling
        run: |
          git config user.name "Proton calibration automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add CMakeLists.txt tools tests matches
          git commit -m "Add sharded Stockfish calibration tooling [calibration-tools-applied]"
          git push
