name: Stockfish 18 calibration bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Proton candidate
        uses: actions/checkout@v7
        with:
          path: proton
          persist-credentials: false

      - name: Check out official Stockfish 18
        uses: actions/checkout@v7
        with:
          repository: official-stockfish/Stockfish
          ref: sf_18
          path: stockfish
          persist-credentials: false

      - name: Build Proton
        run: >-
          cmake -S proton -B proton/build -DCMAKE_BUILD_TYPE=Release
          -DPROTON_BUILD_TESTS=OFF &&
          cmake --build proton/build --config Release --parallel 2

      - name: Build official Stockfish 18
        run: make -C stockfish/src -j2 profile-build ARCH=x86-64

      - name: Verify UCI identities
        run: |
          printf 'uci\nquit\n' | proton/build/proton_chess | grep -F 'uciok'
          printf 'uci\nquit\n' | stockfish/src/stockfish | grep -F 'id name Stockfish 18'

      - name: Stage calibration bundle
        run: |
          mkdir -p bundle/bin
          cp proton/build/proton_chess bundle/bin/proton_chess
          cp stockfish/src/stockfish bundle/bin/stockfish18
          cp -a proton/tools bundle/tools
          cp -a proton/tests bundle/tests
          cp -a proton/openings bundle/openings
          cp proton/requirements.txt proton/CMakeLists.txt proton/README.md bundle/
          cp -a proton/src bundle/src
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > bundle/PROTON_COMMIT
          printf '%s\n' 'sf_18' > bundle/STOCKFISH_REF
          sha256sum bundle/bin/proton_chess bundle/bin/stockfish18 > bundle/SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: proton-stockfish18-calibration-${{ github.event.pull_request.head.sha }}
          path: bundle
          if-no-files-found: error
          retention-days: 2
