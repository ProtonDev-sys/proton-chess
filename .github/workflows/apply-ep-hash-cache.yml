name: Apply en-passant hash cache

on:
  push:
    branches: [agent/cache-ep-hash-state]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ep-cache-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewed source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path("src/engine/position.h")
          text = header.read_text()
          replacements = [
              (
                  "struct UndoState {\n    Piece captured = Empty;\n    int captured_square = NoSquare;\n",
                  "struct UndoState {\n    Piece captured = Empty;\n    std::int8_t ep_hash_file = -1;\n    int captured_square = NoSquare;\n",
              ),
              (
                  "    Color stm_ = White;\n    int castling_ = 0;\n",
                  "    Color stm_ = White;\n    std::int8_t ep_hash_file_ = -1;\n    int castling_ = 0;\n",
              ),
              (
                  "    [[nodiscard]] int ep_hash_file() const;\n",
                  "    [[nodiscard]] std::int8_t ep_hash_file() const;\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"position.h replacement count for {old!r}: {text.count(old)}")
              text = text.replace(old, new, 1)
          header.write_text(text)

          source = Path("src/engine/position.cpp")
          text = source.read_text()
          replacements = [
              (
                  "    fullmove_ = 1;\n    key_ = 0;\n",
                  "    fullmove_ = 1;\n    ep_hash_file_ = -1;\n    key_ = 0;\n",
              ),
              (
                  "int Position::ep_hash_file() const {\n",
                  "std::int8_t Position::ep_hash_file() const {\n",
              ),
              (
                  "            return file_of(ep_);\n",
                  "            return static_cast<std::int8_t>(file_of(ep_));\n",
              ),
              (
                  "    rebuild_bitboards();\n    key_ = compute_key();\n    reset_history();\n",
                  "    rebuild_bitboards();\n    ep_hash_file_ = ep_hash_file();\n    key_ = compute_key();\n    reset_history();\n",
              ),
              (
                  "    undo.fullmove_number = fullmove_;\n    undo.key = key_;\n\n    const auto& z = zobrist();\n    key_ ^= z.castling[castling_ & 15];\n    const int old_ep_file = ep_hash_file();\n    if (old_ep_file >= 0) key_ ^= z.ep[old_ep_file];\n",
                  "    undo.fullmove_number = fullmove_;\n    undo.ep_hash_file = ep_hash_file_;\n    undo.key = key_;\n\n    const auto& z = zobrist();\n    key_ ^= z.castling[castling_ & 15];\n    if (ep_hash_file_ >= 0) key_ ^= z.ep[ep_hash_file_];\n",
              ),
              (
                  "    key_ ^= z.castling[castling_ & 15];\n    const int new_ep_file = ep_hash_file();\n    if (new_ep_file >= 0) key_ ^= z.ep[new_ep_file];\n    key_ ^= z.side;\n",
                  "    key_ ^= z.castling[castling_ & 15];\n    ep_hash_file_ = ep_hash_file();\n    if (ep_hash_file_ >= 0) key_ ^= z.ep[ep_hash_file_];\n    key_ ^= z.side;\n",
              ),
              (
                  "    ep_ = undo.ep_square;\n    halfmove_ = undo.halfmove_clock;\n    fullmove_ = undo.fullmove_number;\n\n    const Color us = stm_;\n",
                  "    ep_ = undo.ep_square;\n    halfmove_ = undo.halfmove_clock;\n    fullmove_ = undo.fullmove_number;\n    ep_hash_file_ = undo.ep_hash_file;\n\n    const Color us = stm_;\n",
              ),
              (
                  "    undo.fullmove_number = fullmove_;\n    undo.key = key_;\n\n    const auto& z = zobrist();\n    const int old_ep_file = ep_hash_file();\n    if (old_ep_file >= 0) key_ ^= z.ep[old_ep_file];\n    ep_ = NoSquare;\n",
                  "    undo.fullmove_number = fullmove_;\n    undo.ep_hash_file = ep_hash_file_;\n    undo.key = key_;\n\n    const auto& z = zobrist();\n    if (ep_hash_file_ >= 0) key_ ^= z.ep[ep_hash_file_];\n    ep_ = NoSquare;\n    ep_hash_file_ = -1;\n",
              ),
              (
                  "    ep_ = undo.ep_square;\n    halfmove_ = undo.halfmove_clock;\n    fullmove_ = undo.fullmove_number;\n    key_ = undo.key;\n    if (!null_barriers_.empty()) null_barriers_.pop_back();\n",
                  "    ep_ = undo.ep_square;\n    halfmove_ = undo.halfmove_clock;\n    fullmove_ = undo.fullmove_number;\n    ep_hash_file_ = undo.ep_hash_file;\n    key_ = undo.key;\n    if (!null_barriers_.empty()) null_barriers_.pop_back();\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"position.cpp replacement count for {old!r}: {text.count(old)}")
              text = text.replace(old, new, 1)
          source.write_text(text)

          tests = Path("tests/test_engine.cpp")
          text = tests.read_text()
          old = """    expect(pinned_ep.key() == pinned_no_ep.key(),
                     \"illegal en-passant right does not change the repetition key\");
          }
          """
          new = """    expect(pinned_ep.key() == pinned_no_ep.key(),
                     \"illegal en-passant right does not change the repetition key\");

              const std::string relevant_ep_fen = relevant_ep.fen();
              const std::uint64_t relevant_ep_key = relevant_ep.key();
              proton::UndoState ep_null_undo;
              relevant_ep.make_null_move(ep_null_undo);
              relevant_ep.unmake_null_move(ep_null_undo);
              expect(relevant_ep.fen() == relevant_ep_fen &&
                         relevant_ep.key() == relevant_ep_key &&
                         !relevant_ep.parse_uci_move(\"d5e6\").is_null(),
                     \"null make/unmake restores a hash-relevant en-passant right\");
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f"test replacement count: {text.count(old)}")
          tests.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source changes
        run: |
          git config user.name "Proton engine automation"
          git config user.email "72932384+ProtonDev-sys@users.noreply.github.com"
          git add src/engine/position.h src/engine/position.cpp tests/test_engine.cpp
          git commit -m "Cache hash-relevant en-passant state [ep-cache-applied]"
          git push
